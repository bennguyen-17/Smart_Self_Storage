services:
  mysql:
    image: mysql:8.0
    container_name: smart-storage-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_storage
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - smart-storage-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-storage-backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_storage?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpassword
    ports:
      - "8080:8080"
    networks:
      - smart-storage-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-storage-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - smart-storage-net

volumes:
  mysql-data:

networks:
  smart-storage-net:
    driver: bridge
